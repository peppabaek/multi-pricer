# Render Blueprint. Point Render at this repo and it reads this file.
#
# What runs here and what does not:
#   - Pricing, schedules, Greeks and term sheet extraction all work.
#   - Live LSEG market data does NOT. The eikon library talks to the LSEG Workspace
#     desktop application on the same machine; there is no desktop here, so the
#     dashboard serves its baseline quotes and reports is_live_connected: false.
#     Traders must not read a hosted deployment as live prices.
services:
  - type: web
    name: multipricer
    runtime: python
    # Free: no card, and enough for the pricer and term sheet extraction. It spins
    # down when idle, so the first request after a quiet spell waits about a minute,
    # and it cannot carry a persistent disk - see the note on holidays below.
    # For a desk that needs it always warm, change to `starter` (paid) and re-add the
    # disk and PRICER_DATA_DIR commented out at the bottom of this file.
    plan: free
    region: singapore        # nearest to Seoul
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    # True because that is what the service actually does. It was false here while
    # the dashboard deployed on every push anyway, so the file described a policy
    # nobody was following - and a deploy that "just happened" looked like a fault
    # rather than the setting working as configured.
    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Logs carry Korean; unbuffered so they appear in Render's log tail as they happen.
      - key: PYTHONIOENCODING
        value: utf-8
      - key: PYTHONUNBUFFERED
        value: "1"

      # Required. Without both, the dashboard answers 503 rather than serving a
      # term sheet uploader to anyone who finds the URL.
      - key: PRICER_AUTH_USER
        sync: false
      - key: PRICER_AUTH_PASS
        sync: false

      # Term sheet extraction. Set the key for whichever provider you use.
      - key: TERMSHEET_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TIER
        value: paid          # 데이터 정책 문구에만 쓰입니다. 동작은 바뀌지 않습니다.

      # 사진은 Gemini 만, 텍스트는 Gemini 다음 Groq.
      #
      # Anthropic 을 빼둔 것은 계정에 API 크레딧이 없어서입니다 - 사다리에
      # 남겨두면 Gemini 가 막힐 때마다 400 을 한 번 받고 지나갑니다.
      # 크레딧을 넣으면 "groq,anthropic" 으로 바꾸세요.
      #
      # GROQ_API_KEY 가 없으면 groq 는 자동으로 빠지고 Gemini 단독이 됩니다 -
      # 키를 대시보드에 넣는 순간 텍스트 폴백이 살아납니다. 사진에는 영향이
      # 없습니다. Groq 에 이미지 모델이 없어 비전 후보에서 걸러집니다.
      - key: TERMSHEET_FALLBACK_PROVIDERS
        value: groq
      - key: ANTHROPIC_API_KEY
        sync: false

      # Second opinion. Leave the key unset to run single-model; the review popup
      # says so rather than implying two models agreed.
      # Turn on once a Groq key exists; naming it without one makes every upload
      # report a cross-check that did not run.
      # - key: TERMSHEET_SECOND_PROVIDER
      #   value: groq
      - key: GROQ_API_KEY
        sync: false

      # On. Photographing a term sheet and uploading it from the phone is the
      # mobile build's whole point, and the review popup still stands between the
      # model's reading and the dashboard.
      #
      # Worth knowing: redaction works on a document's text, and a photo has none,
      # so on this path the image reaches the model as it arrived. Text documents
      # (PDF, Excel, Word) are still masked as before. Set to 0 to turn the image
      # path back off.
      - key: TERMSHEET_ALLOW_IMAGE
        value: "1"


# Holidays: with no disk, a holiday added through the dashboard lives only until the
# next deploy. The 18 bundled calendars still load and price correctly - what is lost
# is an edit made after deployment, which has to be committed to holidays_data.json
# instead. To keep those edits, move to a paid plan and restore:
#
#     plan: starter
#     envVars:
#       - key: PRICER_DATA_DIR
#         value: /var/data
#     disk:
#       name: pricer-data
#       mountPath: /var/data
#       sizeGB: 1
