<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>MULTIPRICER Mobile</title>

    <!-- 홈 화면에 추가했을 때 주소창 없이 앱처럼 열리도록. iOS 는 manifest 의
         icons 를 보지 않으므로 apple-touch-icon 이 따로 필요합니다. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0b1f3f">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MULTIPRICER">
    <!-- 숫자를 길게 눌렀을 때 iOS 가 전화번호로 인식해 파랗게 칠하는 것을 막습니다. -->
    <meta name="format-detection" content="telephone=no">

    <link rel="stylesheet" href="m.css?v=1">
</head>
<body>

<header class="m-head">
    <span class="m-logo">MULTI<b>PRICER</b></span>
    <button type="button" class="m-feed" id="feed-badge" title="시세 출처">● …</button>
</header>

<nav class="m-tabs" id="product-tabs" aria-label="상품 선택"></nav>

<!-- 결과가 맨 위입니다. 입력 하나 바꾸고 숫자를 바로 봐야 하는데, PC 순서
     (입력 → 결과)면 휴대폰에서는 매번 스크롤해야 합니다. -->
<section class="m-out" id="results" aria-live="polite">
    <div class="m-out-main">
        <div class="m-out-lbl">PAR SWAP RATE</div>
        <div class="m-out-val" id="out-par">—</div>
        <div class="m-out-sub" id="out-spread"></div>
    </div>
    <div class="m-out-row">
        <div class="m-out-cell">
            <div class="m-out-lbl">NPV</div>
            <div class="m-out-num" id="out-npv">—</div>
        </div>
        <div class="m-out-cell">
            <div class="m-out-lbl">DV01 / bp</div>
            <div class="m-out-num" id="out-dv01">—</div>
        </div>
    </div>
    <div class="m-out-extra" id="out-extra" hidden></div>
    <div class="m-stamp" id="out-stamp"></div>
</section>

<div class="m-note" id="notice" hidden></div>

<!-- Term Sheet 조건이 적용되면 여기에 띄웁니다. 적용 사실을 숨기면 트레이더는
     바닐라 가격을 보고 있다고 믿게 됩니다. -->
<div class="m-ts-on" id="ts-applied" hidden>
    <span id="ts-applied-text"></span>
    <button type="button" id="ts-clear">해제</button>
</div>

<main class="m-form">
    <label class="m-field">
        <span>명목금액</span>
        <input type="text" inputmode="numeric" id="in-notional" value="100,000,000">
    </label>

    <label class="m-field">
        <span>포지션</span>
        <select id="in-position">
            <option value="Pay Fixed">Pay Fixed (고정 지급)</option>
            <option value="Rec Fixed">Rec Fixed (고정 수취)</option>
        </select>
    </label>

    <div class="m-field">
        <span>테너</span>
        <div class="m-tenors" id="tenor-chips"></div>
    </div>

    <div class="m-pair">
        <label class="m-field">
            <span>쿠폰 (%)</span>
            <input type="text" inputmode="decimal" id="in-coupon" placeholder="비우면 par">
        </label>
        <label class="m-field">
            <span>스프레드 (bp)</span>
            <input type="text" inputmode="decimal" id="in-spread" value="0.0">
        </label>
    </div>

    <details class="m-more" id="date-block">
        <summary>개시일 · 만기일 직접 지정</summary>
        <div class="m-pair">
            <label class="m-field">
                <span>개시일</span>
                <input type="date" id="in-eff">
            </label>
            <label class="m-field">
                <span>만기일</span>
                <input type="date" id="in-mat">
            </label>
        </div>
        <p class="m-hint">비워두면 테너로 자동 계산합니다 (spot T+2). 만기일을 넣으면
            테너보다 우선합니다.</p>
    </details>

    <div class="m-upload">
        <input type="file" id="ts-file" accept="image/*,.pdf,.xlsx,.xls,.csv,.docx,.hwpx,.txt,.html" hidden>
        <button type="button" id="ts-btn">📷 Term Sheet 사진 / 파일</button>
        <p class="m-hint" id="ts-hint">사진을 찍어 올리면 조건을 읽어 채웁니다. 적용 전에
            검토 화면이 뜹니다.</p>
    </div>

    <a class="m-pclink" href="/?view=pc">PC 버전 보기 →</a>
</main>

<!-- Term Sheet 검토 팝업. 확인을 누르기 전에는 아무것도 반영되지 않습니다. -->
<div class="m-modal" id="ts-modal" hidden>
    <div class="m-modal-head">
        <strong id="ts-modal-title">Term Sheet 분석 결과</strong>
        <button type="button" id="ts-close" aria-label="닫기">✕</button>
    </div>
    <div class="m-modal-body" id="ts-modal-body"></div>
    <div class="m-modal-foot">
        <button type="button" id="ts-cancel">취소 · 폐기</button>
        <button type="button" class="primary" id="ts-confirm">확인 · 적용</button>
    </div>
</div>

<div class="m-busy" id="busy" hidden><div class="m-busy-box" id="busy-text">분석 중…</div></div>

<!-- id 는 공용 겹침 검사(ui_mobile_layout.COVERED)가 "떠 있는 막대"로 알아보는 이름입니다. -->
<nav class="m-bar" id="mobile-actions">
    <button type="button" id="btn-price">Price</button>
    <button type="button" class="primary" id="btn-reload">Reload &amp; Price</button>
</nav>

<div class="m-toast" id="toast" hidden></div>

<script src="pricing-core.js?v=1"></script>
<script src="m.js?v=1"></script>
</body>
</html>
